[project]
name = "mp3exact"
version = "0.1.0"
description = "Sample-exact MP3 tools — cut, split, join and inspect without re-encoding or drifting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The cutter is deliberately dependency-free: it parses MPEG frames directly.
dependencies = []

[project.scripts]
mp3cut = "mp3cut:main"
mp3split = "mp3split:main"
mp3join = "mp3join:main"
mp3info = "mp3info:main"

[dependency-groups]
# Only the verifier needs numpy, for the FFT cross-correlation.
dev = ["numpy>=1.24", "ruff==0.16.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mp3frames.py", "id3.py", "mp3cut.py", "mp3split.py", "mp3join.py", "mp3info.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Stated explicitly on purpose. Leaving this implicit meant the rule set was
# whatever the installed ruff defaulted to, so a cached 0.9 passed locally
# while 0.16 failed in CI on rules that had since been added to the default.
# UP031 (%-formatting) is deliberately absent: this codebase uses % throughout.
select = ["E4", "E7", "E9", "F", "EXE", "SIM115"]
